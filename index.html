<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xians Webhook Flow</title>
  <meta name="description" content="A GitHub webhook through Xians in nine steps, from a labelled PR to a posted review, plus redelivery from Agent Studio." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>How a GitHub webhook flows through Xians</h1>
      <p class="lede">Click a step. <span class="req-chip demo">req</span> = the delivery's request ID is there.</p>
    </header>

    <ol class="flow" id="flow" aria-label="Webhook flow"></ol>

    <button type="button" class="loop" id="loop" aria-label="Redeliver: back to step 2">
      <span class="loop-ico" aria-hidden="true">↺</span>
      <span><b>Redeliver</b> from Agent Studio → back to <b>step 2</b> with a new request ID</span>
    </button>

    <div class="controls">
      <button type="button" class="btn" id="prev" aria-label="Previous step">◀</button>
      <button type="button" class="btn btn-primary" id="play">▶ Play</button>
      <button type="button" class="btn" id="next" aria-label="Next step">▶</button>
    </div>

    <section class="card detail" id="detail" aria-live="polite"></section>
  </main>

  <script src="flow-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
